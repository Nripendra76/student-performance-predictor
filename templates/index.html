
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Student Grade Predictor</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins',sans-serif;

            background:linear-gradient(
                135deg,
                #141e30,
                #243b55
            );

            min-height:100vh;

            padding:40px 20px;

            display:flex;

            justify-content:center;

            align-items:flex-start;
        }

        .container{

            width:100%;

            max-width:520px;
        }

        .card{

            width:100%;

            padding:40px;

            border-radius:25px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(16px);

            border:1px solid rgba(255,255,255,0.1);

            box-shadow:
            0 8px 32px rgba(0,0,0,0.35);

            color:white;
        }

        h1{

            text-align:center;

            margin-bottom:10px;

            font-size:34px;

            font-weight:700;
        }

        .subtitle{

            text-align:center;

            margin-bottom:35px;

            color:#d1d1d1;

            font-size:14px;
        }

        .input-group{

            margin-bottom:22px;
        }

        .input-group label{

            display:block;

            margin-bottom:8px;

            font-size:14px;

            font-weight:500;
        }

        .input-group input{

            width:100%;

            padding:16px;

            border:none;

            outline:none;

            border-radius:14px;

            background:rgba(255,255,255,0.12);

            color:white;

            font-size:15px;

            transition:0.3s;
        }

        .input-group input::placeholder{

            color:#cccccc;
        }

        .input-group input:focus{

            background:rgba(255,255,255,0.18);

            box-shadow:0 0 12px rgba(0,140,255,0.5);
        }

        button{

            width:100%;

            padding:16px;

            border:none;

            border-radius:14px;

            background:linear-gradient(
                135deg,
                #00c6ff,
                #0072ff
            );

            color:white;

            font-size:17px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            transform:translateY(-2px);

            box-shadow:0 0 18px rgba(0,114,255,0.6);
        }

        .result{

            margin-top:30px;

            padding:20px;

            border-radius:16px;

            background:rgba(0,255,170,0.12);

            border:1px solid rgba(0,255,170,0.4);

            text-align:center;

            animation:fadeIn 0.5s ease;

            overflow-wrap:break-word;
        }

        .result h2{

            color:#00ffb3;

            margin-bottom:10px;

            font-size:28px;
        }

        .result p{

            font-size:16px;

            color:#f1f1f1;
        }

        .footer{

            margin-top:25px;

            text-align:center;

            color:#bdbdbd;

            font-size:13px;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(10px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        @media(max-width:600px){

            .card{

                padding:25px;
            }

            h1{

                font-size:28px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>AI Grade Predictor</h1>

            <div class="subtitle">

                Predict student academic performance using Machine Learning

            </div>

            <form action="/predict" method="POST">

                <div class="input-group">

                    <label>Student Name</label>

                    <input
                        type="text"
                        name="student_name"
                        placeholder="Enter student name"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Weekly Study Hours</label>

                    <input
                        type="number"
                        step="any"
                        name="study_hours"
                        placeholder="Enter study hours"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Attendance Percentage</label>

                    <input
                        type="number"
                        step="any"
                        name="attendance"
                        placeholder="Enter attendance percentage"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Class Engagement Score</label>

                    <input
                        type="number"
                        step="any"
                        name="participation"
                        placeholder="Enter participation score"
                        required
                    >

                </div>

                <button type="submit">

                    Predict Grade

                </button>

            </form>

            {% if prediction_text %}

            <div class="result">

                <h2>{{ prediction_text }}</h2>

                <p>Prediction generated successfully</p>

            </div>

            {% endif %}

            <div class="footer">

                Powered by Flask + Machine Learning + SQL Server

            </div>

        </div>

    </div>

</body>

</html>
