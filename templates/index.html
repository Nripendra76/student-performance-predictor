<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Student Grade Predictor</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins',sans-serif;

            background:linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #334155
            );

            min-height:100vh;

            padding:60px;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        .container{

            width:100%;

            max-width:1700px;
        }

        .card{

            width:100%;

            padding:120px;

            border-radius:45px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(25px);

            border:2px solid rgba(255,255,255,0.1);

            box-shadow:
            0 20px 60px rgba(0,0,0,0.45);

            color:white;
        }

        h1{

            text-align:center;

            margin-bottom:20px;

            font-size:90px;

            font-weight:700;

            letter-spacing:2px;
        }

        .subtitle{

            text-align:center;

            margin-bottom:70px;

            color:#d1d5db;

            font-size:30px;

            line-height:1.7;
        }

        .input-group{

            margin-bottom:45px;
        }

        .input-group label{

            display:block;

            margin-bottom:18px;

            font-size:30px;

            font-weight:600;
        }

        .input-group input{

            width:100%;

            padding:38px;

            border:none;

            outline:none;

            border-radius:24px;

            background:rgba(255,255,255,0.12);

            color:white;

            font-size:30px;

            transition:0.3s;
        }

        .input-group input::placeholder{

            color:#d1d5db;
        }

        .input-group input:focus{

            background:rgba(255,255,255,0.18);

            box-shadow:0 0 25px rgba(0,140,255,0.6);
        }

        button{

            width:100%;

            padding:38px;

            border:none;

            border-radius:24px;

            background:linear-gradient(
                135deg,
                #06b6d4,
                #2563eb
            );

            color:white;

            font-size:36px;

            font-weight:700;

            cursor:pointer;

            transition:0.3s;

            margin-top:20px;
        }

        button:hover{

            transform:translateY(-5px);

            box-shadow:0 0 30px rgba(37,99,235,0.7);
        }

        .result{

            margin-top:60px;

            padding:40px;

            border-radius:24px;

            background:rgba(0,255,170,0.12);

            border:2px solid rgba(0,255,170,0.4);

            text-align:center;

            animation:fadeIn 0.5s ease;
        }

        .result h2{

            color:#00ffb3;

            margin-bottom:18px;

            font-size:65px;
        }

        .result p{

            font-size:28px;

            color:#f1f5f9;
        }

        .footer{

            margin-top:55px;

            text-align:center;

            color:#cbd5e1;

            font-size:24px;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        @media(max-width:1200px){

            .card{

                padding:70px;
            }

            h1{

                font-size:60px;
            }

            .subtitle{

                font-size:22px;
            }

            .input-group label{

                font-size:22px;
            }

            .input-group input{

                font-size:22px;

                padding:26px;
            }

            button{

                font-size:26px;

                padding:28px;
            }

            .result h2{

                font-size:42px;
            }

        }

        @media(max-width:768px){

            body{

                padding:20px;
            }

            .card{

                padding:35px;
            }

            h1{

                font-size:42px;
            }

            .subtitle{

                font-size:18px;
            }

            .input-group label{

                font-size:18px;
            }

            .input-group input{

                font-size:18px;

                padding:20px;
            }

            button{

                font-size:20px;

                padding:20px;
            }

            .result h2{

                font-size:30px;
            }

            .result p{

                font-size:18px;
            }

            .footer{

                font-size:16px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>AI Grade Predictor</h1>

            <div class="subtitle">

                Predict Student Academic Performance using Machine Learning and SQL Server

            </div>

            <form action="/predict" method="POST">

                <div class="input-group">

                    <label>Student Name</label>

                    <input
                        type="text"
                        name="student_name"
                        placeholder="Enter Student Name"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Weekly Study Hours</label>

                    <input
                        type="number"
                        step="any"
                        name="study_hours"
                        placeholder="Enter Weekly Study Hours"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Attendance Percentage</label>

                    <input
                        type="number"
                        step="any"
                        name="attendance"
                        placeholder="Enter Attendance Percentage"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Class Engagement Score</label>

                    <input
                        type="number"
                        step="any"
                        name="participation"
                        placeholder="Enter Class Participation Score"
                        required
                    >

                </div>

                <button type="submit">

                    Predict Grade

                </button>

            </form>

            {% if prediction_text %}

            <div class="result">

                <h2>{{ prediction_text }}</h2>

                <p>Prediction Generated Successfully</p>

            </div>

            {% endif %}

            <div class="footer">

                Powered by Flask • Machine Learning • SQL Server

            </div>

        </div>

    </div>

</body>

</html>
